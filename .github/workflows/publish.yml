name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # required for npm trusted publishing (OIDC)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v${tag} does not match package version ${version}"
            exit 1
          fi

      # No devDependencies, build step, or lockfile — nothing to install.
      # Authenticates via OIDC from the trusted publisher configured on
      # npmjs.com; no NPM_TOKEN needed. Provenance is attached automatically.
      - run: npm publish
